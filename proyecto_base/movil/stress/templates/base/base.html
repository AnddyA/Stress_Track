{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StressTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://kit.fontawesome.com/33dda385d1.js" crossorigin="anonymous"></script>
</head>

<body>
    {% include "elements/header.html" %}
    {% block content %}
    {% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <a href="{% static '_site/index.html' %}" target="_blank" class="float-docs-btn" title="Ver Manual de Usuario">
        <i class="fa-solid fa-book-open"></i>
    </a>

    <style>
        .float-docs-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #2563eb;
            /* Color azul */
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            text-align: center;
            line-height: 50px;
            /* Centrar verticalmente */
            font-size: 24px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            text-decoration: none;
            transition: transform 0.2s;
        }

        .float-docs-btn:hover {
            background-color: #1e40af;
            transform: scale(1.1);
            /* Efecto de crecimiento */
        }
    </style>
</body>

</html>
