{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script defer src="https://kit.fontawesome.com/33dda385d1.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

    {% include "elements/dashboard_header.html" %}

    {% block content %}
    {% endblock %}

    <script>
        // Función para alternar el modo oscuro
        function toggleDarkMode() {
            const body = document.body;
            const icon = document.getElementById('theme-icon'); // Seleccionamos el icono

            body.classList.toggle('dark-mode');

            // Guardar preferencia en LocalStorage y cambiar icono
            if (body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark');
                document.documentElement.setAttribute('data-bs-theme', 'dark');

                // Si está en modo oscuro, mostramos el sol
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            } else {
                localStorage.setItem('theme', 'light');
                document.documentElement.setAttribute('data-bs-theme', 'light');

                // Si está en modo claro, mostramos la luna
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
            }
        }

        // Aplicar el tema al cargar la página
        (function () {
            const savedTheme = localStorage.getItem('theme');
            const icon = document.getElementById('theme-icon'); // Seleccionamos el icono

            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
                document.documentElement.setAttribute('data-bs-theme', 'dark');

                // Aseguramos que el sol aparezca si recargamos en modo oscuro
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            }
        })();
    </script>

</body>

</html>
